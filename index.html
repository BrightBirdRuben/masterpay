  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &quot;message&quot;,

;font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}#mp-how [hidden]{display:none!important}#mp-how .motion{animation:mp-shift .5s ease-out}@keyframes mp-shift{from{transform:translateY(10px)}to{transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#mp-how .motion{animation:none}}@media(max-width:650px){#mp-how .hero{padding:40px 22px 35px}#mp-how .step{grid-template-columns:1fr;gap:23px;padding:35px 0}#mp-how .steps{padding:0 22px}#mp-how .step h2{font-size:26px}#mp-how .visual{padding:20px}#mp-how .bottom{margin:0 22px;padding:30px 0}#mp-how .intro{font-size:16px}#mp-how .logo{width:120px}}

&lt;section class=&quot;hero&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Van openstaande factuur naar volgende stap&lt;/div&gt;&lt;h1&gt;Jij uploadt.&lt;br&gt;Wij helpen je vooruit.&lt;/h1&gt;&lt;p class=&quot;intro&quot;&gt;Eén factuur of een hele bundel. Ontdek wat we voor je kunnen doen. Gratis starten, zelf beslissen.&lt;/p&gt;&lt;nav class=&quot;jump&quot; aria-label=&quot;De vier stappen&quot;&gt;&lt;a href=&quot;#mp-step1&quot;&gt;1. Upload&lt;/a&gt;&lt;a href=&quot;#mp-step2&quot;&gt;2. Vul aan&lt;/a&gt;&lt;a href=&quot;#mp-step3&quot;&gt;3. Bekijk&lt;/a&gt;&lt;a href=&quot;#mp-step4&quot;&gt;4. Beslis&lt;/a&gt;&lt;/nav&gt;&lt;/section&gt;

&lt;section class=&quot;step&quot; id=&quot;mp-step1&quot;&gt;&lt;div class=&quot;copy&quot;&gt;&lt;div class=&quot;number&quot;&gt;STAP 01&lt;/div&gt;&lt;h2&gt;Upload je&lt;br&gt;openstaande facturen.&lt;/h2&gt;&lt;p&gt;Eén factuur of een hele bundel, van één of meerdere klanten: laad ze gratis op. Wij lezen de gegevens en zetten alles per klant op een rij.&lt;/p&gt;&lt;p&gt;Jij controleert de gegevens en openstaande bedragen. Is er al een deel betaald? Dan pas je dat eenvoudig aan.&lt;/p&gt;&lt;p class=&quot;key&quot;&gt;Eén overzicht. Ook bij meerdere klanten.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;illustrated-step&quot;&gt;&lt;img class=&quot;step-art&quot; src=&quot;data:image/webp;base64,UklGRjyQAABXRUJQVlA4IDCQAACwPgKdASogAyADPj0ejUSiIaMio3Jp6GAHiWdu/+k67dy1dN2wan1Hhq78q/uv9/2lct+2f3H+E/cn+//A5yL4Zeyvwf67/wfz1/2f+D3x/Hf87ze/N/17/l/4v8n/mz/zf/N/lv8N8OP6d/qf+7/jv31+gb9XP+T/hf81+1vx2/t37zv8F/5Px0+A39Z/1H7Z+8Z/zv2p94H92/6P7WfAD/Qv8//+/+N2pH+Z/7P/49wv+ef7X/7e0f/4v3K/6Hyx/2X/i/tt/1Pkk/Zz/9+wB/8vUA/9fXL+Uf6f/E+mH5h/C/6X/F/kV2yPtb99/cL+//sz9+P7NnL7QvYP2S/mn3p/T/3z9zv77+4/3b/sv+x/lPHf5R/7XqEflP87/yH95/c//HfuP5xviH8F/zfQF9v/rH+u/vn7v/5743vr/+v6JfxP+Y/53+L+AH+of1H/a/3H95/8T///fQ8Tr7p/y/2r+AP+df3P/r/5j8nfk2/6/87/tP3J94X09/5/8//sfkP/mn9o/53+G/0f/y/1n/////3mf//3ZfuP/+/dy/aT//jy4HqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqiWopN3d3d3d3d3d3ad8zKqRWnSWdXuvDgeqqqqqJa3yVp0jRmZmZmZmZmZmZmZmYFCqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqbZtNb5K06RozMzMzMwKFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVNs2mt8ladI0ZmZmBMsNMslgTNcwLvRAlnmKWebTUNqtb4/rTA0hBfUFINHJ5V3lt+mZgpcbtybCRMuV9bpN1jCCtQl4PR6lsTvEVj0YMP6EkMRWlvIMi31iBWMV9KL7+RI7+Jp80tVvEkYzQexf5A8fXljde6bTUNqtRQqsitLmDWSzAKHUWseGR9ZgDSnjZ5sUtnyy/+/pSxSkn0J4+N7R4NErHV+UzrEovSW5c3hv2yiSjs2vaGP4kpUx//rFQHz0O082YpotJovomm/61rwwqrZJgNoadNAf///YVX7UIH1dOnq1L4J0AlW8VmznA588hzCNv2K2AnBrrnfPaxxDwATvG1LSG95Tn3jq1blxrcEmKJMzIYf7Ph1nt4CdXZX/+48g6bL/sZerVI///kX8lGT6WnZBu4EOWLic7Tr3BXl3k791HDADUbL0U8A7ebgOoFLwww9Sui0O/r3hcQQ/qKBe+jJLqUHghMaK3x7ovyT6AP//nJ7ZairDcJIX &lt;section class=&quot;step&quot; id=&quot;mp-step3&quot;&gt;&lt;div class=&quot;copy&quot;&gt;&lt;div class=&quot;number&quot;&gt;STAP 03&lt;/div&gt;&lt;h2&gt;Ontdek wat we&lt;br&gt;voor je kunnen doen.&lt;/h2&gt;&lt;p&gt;Je krijgt een eerste voorstel voor de volgende stap. Bijvoorbeeld één gratis vriendelijke herinnering: een eerste of een tweede, afhankelijk van wat je al hebt gedaan.&lt;/p&gt;&lt;p&gt;Is verdere juridische hulp nodig? Dan tonen we vooraf wat we voorstellen, wat inbegrepen is en wat het kost. Ontbreekt er informatie, dan vragen we die eerst.&lt;/p&gt;&lt;p class=&quot;key&quot;&gt;Eerst een duidelijk voorstel. Dan jouw keuze.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;illustrated-step&quot;&gt;&lt;img class=&quot;step-art&quot; src=&quot;data:image/webp;base64,UklGRip+AABXRUJQVlA4IB5+AABQCgKdASogAyADPj0ejEUiIaGRWBT4IAPEs7duZNxmHegHlKiZ23szniU+rP0H/X/z3e6yL6s/X/4b92P8H79Vp/yn95/yv/J+Jf+R3M9j+c95X+0/9D/L/k987f97/0vZB/Sv9l/1/cK/V//l/4n/U/tZ3K/MP+1H7Ze77/x/2t94n9y/4v7P/7j5B/6X/rf/52If+m/7///9wn+l/7j/ye0V/4v3U/9fyw/2L/pftv8EX7P//32AP/17V38A/7XXT+b/6D/Jf3nvA/wv+B/xf/B/v/ki+wfvH94/av+5f+bo69d+Zn8e+4X43+0/uZ/fP3c+9X+T/2fD39i/nP+V/jPYF/IP5v/l/7j+4n+X/b7kagA/r39Z/2H+U/c7/OfBp9V/vP876q/Yj/Tfc39gP9B/qn+v/v37v/4r//++N4c34D/t/tZ8AP83/rP+4/vn+a/an5Cf+P/L/6v9y/dD+mf5X/w/5j/X/If/NP7H/w/8F/n//b/pv/////vB///uH/cT/8+6p+yX/2/escUC4TijRXBkIFwkFsXCcUaK4MhAuEgti4TijRXBkIFwkFsXCcUaK4MhAuEgti4TijTlgk2BcJxRl1Sgh/nkkEsIFwkFsXCcUaK4MhAuEgti4TijQ/QSC2LhOKNFWAEgti4TijRXBkIFwkFsXCcUaK4MhAuEgti4TijRXBkHoK4o0VwZCBcJBbFwnEZ6Jq4o0VwZAOhOKNFcGQgWhAtgWaNIoJ1/AlDzuGAAajg5/xpFBxu5GKPMA3chPyu3ofBHODbR/AE9qPPDo6kAmPH4xNCP21KHWF1bVMgG9KmdlH+tgXCbo0cE9S33D9md+Hul+O+WN6nIy6SLPJE6md5/3FekUfyDpT0FR1ndK51UgbbaRul/6CejOJQdJ47kTnZyTsAc+u7mAaNSjgnX8BFPN21MwlKBbIcES0F3S/9Zf4iNClC4mfnCq5w2yHINwZHWpi6ulrjPfDlJvQbyN0ZFikhRQrzJm4Q9DnYUI0jcBYaHhUi8ybVFi/B3Sh799b3ZSF4mMv1Uy2Q2Xy8JY8gyO7sM/66w80QG4Vf/9Iy0URwJQFcGQDjRpBzuFv+tUQYuBzKt3Atz6HIOhf4IXLjI3twIvD1IuEYhnHl6/vFAxF4JLWsPcWLA6JiP9IBYVotizelg9AvuReZK5Y ot;&gt;&lt;details class=&quot;example-disclosure&quot;&gt;&lt;summary&gt;Bekijk een praktisch voorbeeld&lt;/summary&gt;&lt;div class=&quot;visual&quot;&gt;&lt;div class=&quot;example&quot;&gt;Een mogelijk voorstel&lt;/div&gt;&lt;div class=&quot;sheet&quot;&gt;&lt;h3&gt;Een vriendelijke herinnering&lt;/h3&gt;&lt;p class=&quot;sub&quot;&gt;Verstuurd door MASTER PAY, namens jouw onderneming. Je bekijkt de tekst vóór je akkoord gaat.&lt;/p&gt;&lt;div class=&quot;price&quot;&gt;&lt;span&gt;Deze herinnering&lt;/span&gt;&lt;span class=&quot;gold&quot;&gt;Gratis&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;sub&quot;&gt;Je klant betaalt rechtstreeks op jouw bevestigde rekening.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;smallbutton&quot; id=&quot;mp-letter-toggle&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;mp-letter&quot;&gt;Bekijk de voorbeeldtekst&lt;/button&gt;&lt;div id=&quot;mp-letter&quot; class=&quot;quote&quot; hidden&gt;Beste klant,&lt;br&gt;&lt;br&gt;Volgens ons overzicht staan er nog facturen open. Wil je de betaling even nakijken? Heb je ondertussen betaald of heb je een vraag? Laat het ons gerust weten.&lt;br&gt;&lt;br&gt;Met vriendelijke groet,&lt;br&gt;MASTER PAY, namens jouw leverancier&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;bottom&quot;&gt;&lt;h2&gt;Goed om te weten.&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Wat is precies gratis?&lt;/summary&gt;&lt;p&gt;Je facturen uploaden, een overzicht krijgen en het eerste voorstel bekijken. Bij een geschikt dossier kunnen we één passende vriendelijke herinnering gratis versturen na jouw akkoord. Je ziet vooraf of je dossier hiervoor in aanmerking komt. Verdere juridische hulp is een afzonderlijke opdracht met een vooraf afgesproken prijs.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Wie verstuurt de herinnering?&lt;/summary&gt;&lt;p&gt;MASTER PAY verstuurt de goedgekeurde herinnering namens jouw onderneming. Je hoeft dus niet zelf een brief te versturen. Een formele brief vanuit Master Advocaten is een afzonderlijke juridische stap die we eerst aan je voorleggen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Wat als mijn klant meteen betaalt?&lt;/summary&gt;&lt;p&gt;Dan meld je de betaling in je dossier. Na bevestiging sluiten we de betaalde facturen af. Heeft alleen de gratis herinnering plaatsgevonden? Dan betaal je daarvoor niets.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Wat als mijn klant niet betaalt of de factuur betwist?&lt;/summary&gt;&lt;p&gt;Dan bekijken we welke volgende stap past. Een betwisting of nieuwe betaalafspraak pauzeert de automatische opvolging. Voor professionele overname, bijkomende kosten of een procedure krijg je eerst een nieuw voorstel.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;

  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;

    target?.nodeType === Node.ELEMENT_NODE

    target?.nodeType != null &amp;&amp; trigger.contains(target);

      tooltip.id = tooltipId;

      return;

      selectTab(tab);
      return;

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
